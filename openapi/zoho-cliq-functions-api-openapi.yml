  /functions/{FUNCTION_ID}/handlers/{FUNCTION_HANDLER_TYPE}:
    patch:
      summary: Update a handler for a specific function
      operationId: updateFunctionHandler
      description: 'Update a handler for a specific function. What you provide depends on the function''s execution type:


        Deluge function: Update the script attribute with the revised Deluge source code to execute when the handler fires.


        Webhook function: Update the permissions array to change which data attributes (chat, message, user) are forwarded to your server. Note: attachments and location are not available for function handlers.


        Threshold limit: 10 requests per min per user


        Maximum API calls allowed within one minute.


        Lock period: 5 minutes

        Cooldown period applied after threshold exhaustion.


        !

        Possible Error Codes

        Click to expand


        Error Code

        Description


        execution_handler_update_failed

        Failed to update the handler.


        execution_handler_not_found

        Handler not found for this component.


        Error Response Format


        When an error occurs, the API returns a JSON response in this format:


        {"message": "A human-readable description of the error.", "code": "error_code"}


        where code is the error identifier (as listed above) and message is a human-readable explanation of what went wrong.'
      parameters:
      - schema:
          description: ''
          $ref: '#/components/schemas/FUNCTION_HANDLER_TYPE_regex'
        example: FUNCTION_HANDLER_TYPE
        in: path
        name: FUNCTION_HANDLER_TYPE
        description: "Type of the function handler to update. Supported handler types are:\n<ul>\n  <li><code>button_handler</code> - for button functions</li>\n  <li><code>form_submit_handler</code> - for form functions, triggered on form submission</li>\n  <li><code>form_change_handler</code> - for form functions, triggered on form field value change</li>\n  <li><code>form_view_handler</code> - for form functions, triggered when the form is rendered</li>\n  <li><code>form_dynamic_select_handler</code> - for form functions, triggered when a dynamic select field is loaded</li>\n  <li><code>widget_button_handler</code> - for widget functions, triggered on widget button click</li>\n</ul>\n"
        required: true
      - schema:
          description: ''
          $ref: '#/components/schemas/longid_regex'
        example: FUNCTION_ID
        in: path
        name: FUNCTION_ID
        description: Unique numeric identifier of the function. To learn how to retrieve this ID, see <a href="/cliq/help/restapi/v3/glossary/#FUNCTION_ID">FUNCTION_ID</a> in the Glossary page.
        required: true
      requestBody:
        description: Updates a function handler. For Deluge functions, provide `script`. For Webhook functions, provide `permissions`.
        required: true
        content:
          application/json:
            examples:
              update_script_deluge_button:
                summary: Update script - Deluge button handler
