                  script: 'values = form.get("values");

                    task_name = values.get("task_name");

                    response = Map();

                    response.put("type", "banner");

                    response.put("text", "Task ''" + task_name + "'' created.");

                    response.put("status", "success");

                    return response;'
              update_permissions_webhook_form:
                summary: Update permissions - Webhook form handler
                value:
                  permissions:
                  - chat
                  - user
              form_change_handler:
                summary: Update script - Form change handler
                value:
                  script: "changed_field = form.get(\"changed_field\");\nform_response = Map();\nif(changed_field == \"priority\") {\n  priority_val = form.get(\"values\").get(\"priority\");\n  options = List();\n  if(priority_val == \"high\") {\n    options.add(\"Escalate\");\n    options.add(\"Notify Manager\");\n  } else {\n    options.add(\"Standard Process\");\n  }\n  form_response.put(\"action_field\", Map());\n}\nreturn form_response;"
              form_view_handler:
                summary: Update script - Form view handler
                value:
                  script: 'form = Map();

                    form.put("title", "Create Task");

                    fields = List();

                    task_field = Map();

                    task_field.put("name", "task_name");

                    task_field.put("label", "Task Name");

                    task_field.put("type", "text");

                    task_field.put("mandatory", true);

                    fields.add(task_field);

                    due_field = Map();

                    due_field.put("name", "due_date");

                    due_field.put("label", "Due Date");

                    due_field.put("type", "date");

                    fields.add(due_field);

                    form.put("fields", fields);

                    actions = Map();

                    submit = Map();

                    submit.put("type", "invoke.function");

                    actions.put("submit", submit);

                    form.put("actions", actions);

                    return form;'
              widget_button_handler:
                summary: Update script - Widget button handler
                value:
                  script: 'button_name = action.get("name");

                    widget = Map();

                    widget.put("type", "zhtml");

                    widget.put("body", "<p>Button ''" + button_name + "'' clicked. Widget refreshed at " + zoho.currenttime + "</p>");

                    return widget;'
