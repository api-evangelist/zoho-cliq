      - name: include
        in: query
        required: false
        schema:
          type: string
        description: "Comma-separated list of additional data to include in the response.<br>\n<b>Allowed value</b>: \n<ul>\n  <li><code>last_message_info</code>: Includes details of the last message in the chat, such as message ID, sender, timestamp, content preview, and message type.</li>\n</ul>\nBy default, last message information is not returned. Specify <code>include=last_message_info</code> to include it in the response.<br>\n<b>Example</b>: <code>https://cliq.zoho.com/api/v3/chats/{CHAT_ID}?include=last_message_info</code>\n"
