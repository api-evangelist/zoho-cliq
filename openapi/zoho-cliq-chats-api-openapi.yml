                  url:
                    type: string
                  type:
                    type: string
                    example: chat_thread
                  data:
                    $ref: '#/components/schemas/v3-thread'
        '400':
          description: Bad Request. The thread chat ID format is invalid.
          content:
            application/json:
              examples:
                thread_chatid_invalid:
                  summary: Invalid thread chat ID format
                  value:
                    code: thread_chatid_invalid
                    message: The thread chat ID given is not according to the format.
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request was rejected because of invalid AuthToken.
        '403':
          description: Forbidden. External communication is restricted by organization policy.
          content:
            application/json:
              examples:
                external_communication_not_supported:
                  summary: External communication not allowed
                  value:
                    code: external_communication_not_supported
                    message: Sorry, external communication is not supported as per the organization policy.
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too many requests within a certain time frame.
        '500':
          description: Internal Server Error.
          content:
            application/json:
              examples:
                operation_failed:
                  summary: Server-side error
                  value:
                    code: operation_failed
                    message: Sorry, we couldn't process your request due to a technical error. Please try again later.
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
      security:
      - Cliq_Auth:
        - ZohoCliq.Chats.READ
      tags:
      - chats
components:
  schemas:
    retrieve-chat-members:
      type: object
      description: Response object containing members of a chat.
      properties:
        members:
          type: array
          description: List of members in the chat with detailed user information.
          items:
            $ref: '#/components/schemas/Members'
    v3-chat:
      type: object
      description: Represents a chat object with comprehensive details including metadata, participants, and message information.
      properties:
        name:
          type: string
          description: Display name of the chat.
        chat_id:
          type: string
          description: Unique identifier for the chat.
        chat_type:
          type: string
          description: 'Type of chat: channel, bot, entity_chat, direct_message, group_chat, crossproduct_custom_chat, thread, or unknown.'
          enum:
          - channel
          - bot
          - entity_chat
          - direct_message
          - group_chat
          - crossproduct_custom_chat
          - thread
          - unknown
        participant_count:
          type: integer
          description: Number of participants in the chat.
        created_time:
          type: string
          format: date-time
          description: Timestamp when the chat was created (<a href="https://en.wikipedia.org/wiki/ISO_8601">ISO 8601</a> format).
        last_modified_time:
          type: string
          format: date-time
          description: Timestamp when the chat was last active or modified (<a href="https://en.wikipedia.org/wiki/ISO_8601">ISO 8601</a> format).
        pinned:
          type: boolean
          description: Whether the chat is pinned by the current user.
        removed:
          type: boolean
          description: Whether the current user has been removed from this chat.
        creator:
          type: object
          description: Details of the user who created the chat.
          properties:
            id:
              type: string
              description: Unique identifier of the creator.
            name:
              type: string
              description: Display name of the creator.
        last_message_info:
          type: object
          description: Summary of the last message in the chat, if available.
          additionalProperties: true
        unread_time:
          type: string
          format: date-time
          description: Timestamp of the first unread message, if any.
        unread_message_count:
          type: integer
          description: Number of unread messages in the chat.
        previous_titles:
          type: string
          description: Historical chat names, if the chat has been renamed.
        thread_message_id:
          type: string
          description: ID of the thread head message. Present only for thread chats.
        parent_chat_id:
          type: string
          description: Chat ID of the parent. Present only for thread chats.
    v3-thread:
      type: object
      properties:
        chat_id:
          type: string
        parent_chat_id:
          type: string
        thread_message_id:
          type: string
        title:
          type: string
        follower_count:
          type: integer
        is_follower:
          type: boolean
        thread_state:
          type: string
        parent_message_sender:
          type: string
        last_message_information:
          type: object
          additionalProperties: true
    v3-fork-chat-request:
      type: object
      required:
      - message_id
      - title
      properties:
        message_id:
          type: string
          description: 'The ID of the message from which to fork the chat. The new chat will include messages starting from this message.

            '
          example: '1234567890123456789'
        user_ids:
          type: string
          description: 'Comma-separated list of user IDs to include in the forked chat. Example: <code>55743307,55622727</code>

            '
          example: 631830848,631830849
        include_participants:
          type: boolean
          default: false
          description: 'Whether to include all participants from the original chat in the forked chat. If set to true, the <code>user_ids</code> field will be ignored and all participants will be included.

            '
          example: false
        title:
          type: string
          maxLength: 255
          description: 'Title of the forked chat. Required when creating a forked chat.

            '
          example: Discussion on Q3 Marketing Strategy
    v3-typing-activity-request:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          description: "The typing activity to send to the chat.<br>\n<b>Allowed values</b>:\n<ul>\n  <li><code>typing</code>: Indicates that the user is currently typing a message.</li>\n  <li><code>text_entered</code>: Indicates that the user has entered text but has not yet sent the message.</li>\n  <li><code>text_cleared</code>: Indicates that the user has cleared the entered text.</li>\n</ul>\n"
          enum:
          - typing
          - text_entered
          - text_cleared
    empty-response:
      type: object
      description: Response returned when there is no content.
      properties:
        Response_Code:
          type: string
          example: 204 No response
    v3-create-chat-request:
      type: object
      description: 'For direct chat, send `chat_type: direct_message` with `user_id`.

        For group chat, send `chat_type: group_chat` with `user_ids` and `title`.

        '
      required:
      - chat_type
      properties:
        chat_type:
          type: string
          description: "Type of chat to create.\n<b>Allowed values</b>:\n<ul>\n  <li><code>direct_message</code>: A one-to-one chat with another user.</li>\n  <li><code>group_chat</code>: A chat with multiple users, requires a title.</li>\n</ul>\n"
          enum:
          - direct_message
          - group_chat
        user_id:
          type: string
          description: 'Applicable for the <code>direct_message</code> chat type.<br>

            User ID of the other participant for direct messages.

            '
        user_ids:
          type: array
          description: 'Applicable for the <code>group_chat</code> chat type.<br>

            List of user IDs to include in the group chat. Must include at least 1 user and can include up to 50 users.

            '
          minItems: 1
          maxItems: 50
          items:
            type: string
        title:
          type: string
          description: 'Applicable for the <code>group_chat</code> chat type.<br>

            Title of the group chat. Required when creating a group chat.

            '
          maxLength: 255
    NoResponse:
      type: object
      description: Response object returned when no content is available.
      properties:
        Response Code:
          type: string
          description: HTTP response code and message indicating no content.
          example: 204 No response
    v3-add-members-request:
      type: object
      required:
      - user_ids
      properties:
        user_ids:
          type: array
          description: 'List of user IDs to add to the chat. Must include at least 1 user and can include up to 100 users.

            '
          minItems: 1
          maxItems: 100
          items:
            type: string
    v3-bulk-chat-update-request:
      type: object
      description: "Supports two payload modes, selected by the <code>operation</code> field:\n<ul>\n  <li><b>Mark as read</b> (<code>read_status_update</code>): Set <code>operation</code> to <code>read_status_update</code>, <code>read_status</code> to <code>read</code>, and provide a <code>chats</code> array with each chat's <code>chat_id</code> and <code>last_message_id</code>. Returns <code>200 OK</code>.</li>\n  <li><b>Clear unread</b> (<code>clear_unread</code>): Set <code>operation</code> to <code>clear_unread</code> and provide a <code>chat_ids</code> array. Returns <code>204 No Content</code>.</li>\n</ul>\n"
      required:
      - operation
      properties:
        operation:
          type: string
          description: "The bulk operation to perform on the specified chats.<br>\n<b>Allowed values</b>:\n<ul>\n  <li><code>read_status_update</code>: Marks the specified chats as read up to the given <code>last_message_id</code>. Requires <code>read_status</code> and <code>chats</code> fields.</li>\n  <li><code>clear_unread</code>: Clears the unread message count or status to zero for the specified chats. Requires <code>chat_ids</code> field.</li>\n</ul>\n"
          enum:
          - read_status_update
          - clear_unread
        read_status:
          type: string
          description: 'The read status to apply to the specified chats.<br>

            Applicable for the <code>read_status_update</code> operation only.<br>

            <b>Allowed value</b>:<br>

            <code>read</code> - Marks the specified chats as read.

            '
          enum:
          - read
        chats:
          type: array
          description: 'List of chats to mark as read. Applicable for the <code>read_status_update</code> operation only.<br>

            Maximum of <b>100</b> chats per request.

            '
          maxItems: 100
          items:
            type: object
            required:
            - chat_id
            - last_message_id
            properties:
              chat_id:
                type: string
                description: Unique identifier of the chat to mark as read.
              last_message_id:
                type: string
                description: The message ID up to which the chat should be marked as read. All messages up to and including this message will be marked read.
        chat_ids:
          type: array
          description: 'List of chat IDs for which to clear the unread count. Applicable for the <code>clear_unread</code> operation only.<br>

            Chats that do not have any unread entries will be skipped without error.<br>

            <b>Maximum items</b>: 100 chat IDs.

            '
          maxItems: 100
          items:
            type: string
    Members:
      type: object
      description: Detailed information about a chat member.
      properties:
        user_id:
          type: string
          description: Unique identifier of the user.
          example: '431930546'
        email_id:
          type: string
          format: email
          description: Email address of the user.
          example: olivia.palmer@zylcal.com
        name:
          type: string
          description: Full name of the user.
          example: Olivia - Content Writer
  securitySchemes:
    Cliq_Auth:
      type: oauth2
      x-authorization-example: Bearer 1000.41d9xxxxxxxxxxxxxxxxxxxxxxxxc2d1.8fccxxxxxxxxxxxxxxxxxxxxxxxx125f
      flows:
        implicit:
          authorizationUrl: https://accounts.zoho.com/oauth/v2/auth
          scopes:
            ZohoCliq.Bots.READ: Read Bot Information
            ZohoCliq.Bots.CREATE: Create Bots
            ZohoCliq.Bots.UPDATE: Update Bots
            ZohoCliq.Bots.DELETE: Delete Bots
            ZohoCliq.Webhooks.CREATE: Post messages to conversations via webhooks
            ZohoCliq.BotMessages.CREATE: Send messages via bot incoming webhooks
            ZohoCliq.Channels.UPDATE: Update Channel Settings
externalDocs:
  description: Find out more about Zoho Cliq APIs V3
  url: https://www.zoho.com/cliq/help/restapi/v3/
