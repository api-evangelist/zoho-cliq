        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated list of response fields to include (max 20).<br>

          By default, a standard set of fields is returned. Use this parameter to include additional fields or to optimize performance by excluding unnecessary data.<br>

          <b>Example</b>: <code>https://cliq.zoho.com/api/v3/chats/{CHAT_ID}?fields=title,chat_type,participant_count,permissions</code>

