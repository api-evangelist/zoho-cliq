openapi: 3.2.0
info:
  title: Zoho Cliq Chats API
  version: 1.0.0
  contact: {}
  description: 'Operations tagged chats across 3 of this provider''s published API definitions: chats.yml, mentions.yml, threads.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://cliq.zoho.com/api/v3
  description: Zoho Cliq US DC
tags:
- name: Chats
  description: Chats Module
paths:
  /chats:
    get:
      summary: Retrieve all direct chats
      operationId: RetrieveAllDirectChats
      description: 'Use this API to get details of all direct chats.


        Threshold limit: 30 requests per min per user


        Number of API calls allowed within a minute.


        Lock period: 10 minutes

        Wait time before consecutive API requests.'
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: 'Search for chats with names that partially match the provided value.<br>

          For example, searching with "pro" may return chats named "Project Alpha" and "Product Launch".

          '
      - name: recipient
        in: query
        required: false
        schema:
          type: string
        description: 'Filter chats containing recipient.<br>

          Provide the recipient <code>USER_ID</code> to return chats that include that user as a participant.<br>

          To learn how to retrieve this ID, see <a href="/cliq/help/restapi/v3/glossary/#USER_ID">USER_ID</a> in the Glossary page.<br>

          For example, searching with <code>70027934</code> returns chats that include that user ID.

          '
      - name: muted
        in: query
        required: false
        schema:
          type: boolean
        description: 'Set this parameter to true to retrieve the list of chats which are muted by the user.

          '
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          maxLength: 100
        description: 'The number of chats that has to be retrieved.<br>

          <b>Maximum limit</b> : 100

          '
      - name: modified_before
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: 'Gets the list of chats where the last message is sent before the mentioned time.

          <br>

          The time should be in <b>epoch milliseconds</b> format.<br>For example, <code>1711929600000</code>.

          '
      - name: modified_after
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: 'Gets the list of chats where the last message is sent after the mentioned time.

          <br>

          The time should be in <b>epoch milliseconds</b> format.<br>For example, <code>1711929600000</code>.

          '
      - name: drafts
        in: query
        required: false
        schema:
          type: boolean
        description: 'Set this parameter to true to retrieve the list of chats which have unsent messages (drafts).

          '
      - name: pinned
        in: query
        required: false
        schema:
          type: boolean
        description: 'Set this parameter to true to retrieve the list of chats which are pinned by the user.

          '
      - name: closed
        in: query
        required: false
        schema:
          type: boolean
        description: 'Set this parameter to true to retrieve the list of chats which are closed by the user.

          '
      - name: joined
        in: query
        required: false
        schema:
          type: boolean
        description: 'Set this parameter to true to retrieve the list of chats which are joined by the user.

          '
      - name: chat_ids
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated list of chat IDs to filter the chats.<br>

          To learn how to retrieve these IDs, see <a href="/cliq/help/restapi/v3/glossary/#CHAT_ID">CHAT_ID</a> in the Glossary page.<br>

          '
      - name: parent_chid
        in: query
        required: false
        schema:
          type: string
        description: 'Filter chats that are threads of a specific parent chat. Provide the parent chat''s <code>CHAT_ID</code> to return all threads under that chat.<br>

          To learn how to retrieve this ID, see <a href="/cliq/help/restapi/v3/glossary/#CHAT_ID">CHAT_ID</a> in the Glossary page.<br>

          '
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - guests
          - threads
          - channel
          - bot
          - dm
          - muted
        description: "Filter chats by type.<br>\n<b>Allowed values</b>:<br>\n<ul>\n  <li><code>threads</code> - Chats that are threads of a parent chat.</li>\n  <li><code>channel</code> - Channel conversations.</li>\n  <li><code>bot</code> - Conversations with bots.</li>\n  <li><code>dm</code> - Direct messages between users.</li>\n  <li><code>muted</code> - Chats that are muted by the user.</li>\n</ul>\n"
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                success:
                  summary: List of direct chats
                  value:
                    chats:
                    - chat_id: '2890538000000012345'
                      name: Alice Johnson
                      chat_type: direct_message
                      participant_count: 2
                      created_time: '2024-06-01T09:00:00.000Z'
                      last_modified_time: '2025-04-10T14:30:00.000Z'
                      pinned: false
                      removed: false
                      creator:
                        id: '70027934'
                        name: Tim Harrison
                      last_message_info:
                        message_id: '1773813859592_51531973059'
                        sender: '70027934'
                        time: '2025-04-10T14:30:00.000Z'
                        content:
                          text: See you at the standup!
                        type: text
                    - chat_id: '2890538000000067890'
                      name: Bob Carter
                      chat_type: direct_message
                      participant_count: 2
                      created_time: '2024-09-15T11:00:00.000Z'
                      last_modified_time: '2025-04-09T09:45:00.000Z'
                      pinned: true
                      removed: false
                      creator:
                        id: '70027934'
                        name: Tim Harrison
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items:
                      $ref: '#/components/schemas/v3-chat'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The request cannot be performed. Usually because of malformed parameter or missing parameter.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request was rejected because of invalid AuthToken.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The user does not have enough permission or possibly not an user of the respective organization to access the resource.
        '404':
          description: Invalid URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The URL you've sent is wrong. It's possible that the resource you've requested has been moved to another URL.
        '405':
          description: Method Not Allowed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The requested resource does not support the HTTP method used. For example, requesting List of all customers API with PUT as the HTTP method.
        '406':
          description: Not Acceptable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The response has been received but the requested response type is not supported by the browser.
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too many requests within a certain time frame.
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cliq server encountered an error which prevents it from fulfilling the request.
      security:
      - Cliq_Auth:
        - ZohoCliq.Chats.READ
      tags:
      - Chats
      x-operation-id-source: normalized
      x-operation-id-original: Retrieve all direct chats
    post:
      summary: Create chat
      operationId: createChatV3
      description: 'Create a new direct conversation or a group chat.


        Threshold limit: 30 requests per min


        Number of API calls allowed within a minute.


        !

        Possible Error Codes

        Click to expand


        Error Code

        Description


        121_deptmem_message

        Permission to chat with department members is restricted by admin.


        121_orgmem_message

        Permission to chat with organization members is restricted by admin.


        chat_continue_nonorg_nonmutual_contact_failed

        The user is no longer part of your contacts or organization.


        121_extmem_message

        Permission to chat with external users is restricted by admin.


        chat_not_available_with_this_inactive_user_and_cannot_create_newchat

        No chat history with this inactive user; cannot create a new chat.


        invalid_inputs

        Missing or invalid fields (e.g. chat_type not provided or unsupported).


        no_valid_users_available_to_create_chat

        All specified users are inactive or not in your contacts.


        insufficient_members_to_create_group_chat

        Not enough valid members to create a group chat (minimum 3 including creator).


        chat_operation_failed

        Unexpected server error while creating the chat.


        Error Response Format


        When an error occurs, the API returns a JSON response in this format:


        {"message": "A human-readable description of the error.", "code": "error_code"}


        where code is the error identifier (as listed above) and message is a human-readable explanation of what went wrong.'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              direct_chat:
                summary: Direct Chat
                value:
                  chat_type: direct_message
                  user_id: '70027934'
              group_chat:
                summary: Group Chat
                value:
                  chat_type: group_chat
                  user_ids:
                  - '70027934'
                  - '106324287'
                  - '70317945'
                  - '72589892'
                  title: Q2 Product Review - Design, Engineering & QA
            schema:
              $ref: '#/components/schemas/v3-create-chat-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                direct_chat:
                  summary: Direct Chat response
                  value:
                    url: /v3/chats
                    type: chat
                    data:
                      user_membership:
                        pinned: false
                        removed: false
                      chat_type: direct_message
                      name: Ryan West
                      creator:
                        name: Ryan West
                        id: '855727963'
                      participant_count: 2
                      created_time: '2024-11-06T22:39:30-08:00'
                      last_modified_time: '2026-05-06T23:37:30-07:00'
                      chat_id: '2198144177691461096'
                group_chat:
                  summary: Group Chat response
                  value:
                    url: /v3/chats
                    type: chat
                    data:
                      name: Q2 Product Review - Design, Engineering & QA
                      chat_id: '1456816193674892935'
                      chat_type: group_chat
                      participant_count: 5
                      created_time: '2025-06-15T10:30:00+05:30'
                      last_modified_time: '2025-06-15T10:30:00+05:30'
                      user_membership:
                        pinned: false
                        removed: false
                      creator:
                        id: '70027934'
                        name: Tim Harrison
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/v3-chat'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The request cannot be performed. Usually because of malformed parameter or missing parameter.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request was rejected because of invalid AuthToken.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The user does not have enough permission or possibly not an user of the respective organization to access the resource.
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too many requests within a certain time frame.
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cliq server encountered an error which prevents it from fulfilling the request.
      security:
      - Cliq_Auth:
        - ZohoCliq.Chats.CREATE
      tags:
      - Chats
    put:
      summary: Mark Multiple Chats as Read or Clear Unread Count
      operationId: bulkUpdateChatsV3
      description: 'Manage the read state of multiple chats in a single request.


        Two bulk actions are supported, controlled by the operation field in the request body:


        read_status_update- Manage the read status of multiple chats in a single request. This is particularly useful for keeping your chat list organized and up-to-date, especially when you have a large number of conversations.


        clear_unread - Clears the unread message count or status to zero for the specified chats. If a specified chat has no unread entries, it is silently skipped.


        Threshold limits: 60 requests per min


        Number of API calls allowed within a minute.


        Lock periods: 5 minutes

        Wait time before consecutive API requests.


        !

        Possible Error Codes

        Click to expand


        Possible Error Codes - Mark Chats as Read (read_status_update)


        Error Code

        Description


        param_missing

        The param ''operation'' is missing.


        param_missing

        The param ''read_status'' is missing.


        param_missing

        The param ''chats'' is missing.


        param_missing

        The param ''chat_id'' is missing.


        invalid.inputs.submitted

        Incorrect values submitted.


        chat_access_denied

        You must be a participant in this chat to perform this action.


        chat_operation_failed

        Unable to perform the action. Please retry.


        Possible Error Codes - Clear Unread Count (clear_unread)


        Error Code

        Description


        param_missing

        The param ''operation'' is missing.


        param_missing

        One or more required params are missing: operation or chat_ids.


        invalid.inputs.submitted

        Incorrect values submitted.


        chat_operation_failed

        Unable to perform the action. Please retry.


        Error Response Format


        When an error occurs, the API returns a JSON response in this format:


        {"message": "A human-readable description of the error.", "code": "error_code"}


        where code is the error identifier (as listed above) and message is a human-readable explanation of what went wrong.'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              read_status_update:
                summary: Mark multiple chats as read
                value:
                  operation: read_status_update
                  read_status: read
                  chats:
                  - chat_id: '2890538000000012345'
                    last_message_id: '1773813859592_51531973059'
                  - chat_id: '2890538000000067890'
                    last_message_id: '1773813860210_51531973060'
              clear_unread:
                summary: Clear unread count for multiple chats
                value:
                  operation: clear_unread
                  chat_ids:
                  - '2890538000000012345'
                  - '2890538000000067890'
            schema:
              $ref: '#/components/schemas/v3-bulk-chat-update-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                read_status_update:
                  summary: Mark as read - success/failure breakdown
                  value:
                    type: chat.read_status
                    data:
                      success:
                      - '2890538000000012345'
                      - '2890538000000067890'
                      failure: []
                clear_unread:
                  summary: Clear unread count
                  value:
                    Response Code: 204 No response
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: chat.read_status
                  data:
                    type: object
                    additionalProperties: true
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The request cannot be performed. Usually because of malformed parameter or missing parameter.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request was rejected because of invalid AuthToken.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The user does not have enough permission or possibly not an user of the respective organization to access the resource.
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too many requests within a certain time frame.
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cliq server encountered an error which prevents it from fulfilling the request.
      security:
      - Cliq_Auth:
        - ZohoCliq.Chats.UPDATE
      tags:
      - Chats
    servers:
    - url: https://cliq.zoho.com/api/v3
      description: Zoho Cliq US DC
  /chats/search:
    get:
      summary: Search chats
      operationId: searchChatsV3
      description: 'Search for chats accessible to the current user. You can filter by name, type, date range, participant, and more.


        Threshold limit: 50 requests per min per user


        Number of API calls allowed within a minute.


        Lock period: 10 minutes

        Wait time before consecutive API requests.


        !

        Possible Error Codes

        Click to expand


        Error Code

        Description


        invalid.inputs.submitted

        An invalid value was passed (e.g. unrecognised chat_type or sort_by).


        invalid.time.submitted

        modified_before or modified_after is not a valid timestamp, or modified_after is not earlier than modified_before.


        invalid_access

        The user is not a member of the organisation.


        chat_operation_failed

        An unexpected server-side error occurred.


        Error Response Format


        When an error occurs, the API returns a JSON response in this format:


        {"message": "A human-readable description of the error.", "code": "error_code"}


        where code is the error identifier (as listed above) and message is a human-readable explanation of what went wrong.'
      parameters:
      - name: title
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
        description: 'Search for chats that include this keyword in their names. The search should be case-insensitive and allow for partial matches.<br>

          <b>Maximum length</b>: 200 characters

          '
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          default: 500
        description: 'The maximum number of chats to return.<br>

          <b>Maximum limit</b>: 500. Default is 500 if not specified.

          '
      - name: modified_before
        in: query
        required: false
        schema:
          type: string
        description: 'Search and return only chats last modified before this time.<br>

          Accepts either epoch time in milliseconds (for example, <code>1711929600000</code>) or <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO 8601</a> format (for example, <code>2024-04-01T00:00:00Z</code>).<br>

          Use the same time format consistently across both <code>modified_before</code> and <code>modified_after</code> in a request for predictable filtering.

          <b>Note:</b> When both modified_before and modified_after are provided, modified_after must be earlier than modified_before.

          '
      - name: modified_after
        in: query
        required: false
        schema:
          type: string
        description: 'Search and return only chats last modified after this time.<br>

          Accepts either epoch time in milliseconds (for example, <code>1711929600000</code>) or <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO 8601</a> format (for example, <code>2024-04-01T00:00:00Z</code>).<br>

          Use the same time format consistently across both <code>modified_before</code> and <code>modified_after</code> in a request for predictable filtering.

          <b>Note:</b> When both modified_before and modified_after are provided, modified_after must be earlier than modified_before.

          '
      - name: recipient
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by recipient user ID. Returns chats where this user is a participant. For direct messages, this will be the other participant; for group chats, this can be any member.

          '
      - name: chat_type
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by chat type.

          Allowed values:<br><code>direct_message</code>, <code>group_chat</code>, <code>channel</code>, <code>thread</code>. You can specify multiple types separated by commas (e.g. <code>direct_message,group_chat</code>) to include multiple chat types in the results.

          '
      - name: parent_chat_id
        in: query
        required: false
        schema:
          type: string
        description: 'Restrict results to threads belonging to this parent chat. Only applicable when filtering for thread-type chats.

          '
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - usage
          - recent
          default: recent
        description: "Sort results by usage or recent activity.<br>\n<b>Allowed values</b>:<br>\n<ul>\n  <li><code>usage</code>: Sort by usage frequency, with the most frequently accessed chats appearing first.</li>\n  <li><code>recent</code>: Sort by recent activity, with the most recently active chats appearing first. This is the default sorting method.</li> \n</ul>\n"
      responses:
        '200':
          description: The request was successfully completed. Returns a list of matching chats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items:
                      $ref: '#/components/schemas/v3-chat'
              examples:
                multiple_chats:
                  summary: Multiple chats found
                  value:
                    chats:
                    - chat_id: 6795XXXXXXXXXXXXXX
                      name: General
                      chat_type: channel
                      participant_count: 42
                      created_time: '2024-01-10T09:00:00.000Z'
                      last_modified_time: '2025-03-20T14:30:00.000Z'
                      pinned: false
                      removed: false
                      creator:
                        id: 711622XXXX
                        name: Alice
                      last_message_info:
                        message_id: '1710934200000'
                        sender: 711622XXXX
                        time: '2025-03-20T14:30:00.000Z'
                        content:
                          text: Hello everyone!
                        type: text
                    - chat_id: 6795YYYYYYYYYYYY
                      name: Bob
                      chat_type: direct_message
                      participant_count: 2
                      created_time: '2024-06-01T10:00:00.000Z'
                      last_modified_time: '2025-03-18T11:00:00.000Z'
                      pinned: false
                      removed: false
        '400':
          description: Bad Request. Invalid parameter values submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              examples:
                invalid_inputs:
                  summary: Invalid input parameters
                  value:
                    error:
                      code: invalid.inputs.submitted
                      message: An invalid value was passed. Please check chat_type or sort_by parameters.
                invalid_time:
                  summary: Invalid timestamp
                  value:
                    error:
                      code: invalid.time.submitted
                      message: Invalid timestamp format or modified_after must be earlier than modified_before.
        '401':
          description: Unauthorized. Invalid or missing authentication token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              examples:
                unauthorized:
                  summary: Invalid auth token
                  value:
                    error:
                      code: unauthorized
                      message: Request was rejected because of invalid AuthToken.
        '403':
          description: Forbidden. User does not have access to this resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              examples:
                invalid_access:
                  summary: Access denied
                  value:
                    error:
                      code: invalid_access
                      message: You are not a member of this organisation or do not have permission to access this resource.
        '429':
          description: Too many requests. Rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              examples:
                rate_limit:
                  summary: Rate limit exceeded
                  value:
                    error:
                      code: rate_limit_exceeded
                      message: Too many requests within a certain time frame. Please try again later.
        '500':
          description: Internal Server Error. An unexpected server-side error occurred.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              examples:
                server_error:
                  summary: Server error
                  value:
                    error:
                      code: chat_operation_failed
                      message: Cliq server encountered an error which prevents it from fulfilling the request.
      security:
      - Cliq_Auth:
        - ZohoCliq.Chats.READ
      tags:
      - Chats
    servers:
    - url: https://cliq.zoho.com/api/v3
      description: Zoho Cliq US DC
  /chats/{CHAT_ID}:
    get:
      summary: Retrieve chat details
