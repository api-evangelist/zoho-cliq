      security:
      - Cliq_Auth:
        - ZohoCliq.Webhooks.CREATE
      tags:
      - Messages
  /chats/{CHAT_ID}/messages:
    post:
      summary: Post message in chat
      operationId: Post message in chat
      description: 'To post message in a chat (or thread), the chat_id (thread_id in case of threads) can be used in the request URL.


        Threshold limit: 50 requests per min per user


        Number of API calls allowed within a minute.


        This limit is per user, not per token — even if messages are sent using multiple OAuth tokens by the same user, all requests count toward this shared limit.


        Lock period: 10 minutes

        Wait time before consecutive API requests.'
      parameters:
      - name: CHAT_ID
        in: path
        required: true
        schema:
          type: string
        example: CHAT_ID
        description: The ID of the chat where the message should be posted. To learn how to retrieve this ID, see <a href="/cliq/help/restapi/v3/glossary/#CHAT_ID">CHAT_ID</a> in the Glossary page.
      requestBody:
        content:
          application/json:
            schema:
