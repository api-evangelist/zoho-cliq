openapi: 3.2.0
info:
  title: Messages API
  description: The Messages API is essential for communication within Zoho Cliq, allowing you to send, retrieve, and manage messages across chats, channels, and bots.
  contact: {}
  version: 1.0.0
servers:
- url: https://cliq.zoho.com/api/v3
  description: Zoho Cliq US DC
tags:
- name: Messages
  description: Messages Module
paths:
  /chats/{CHAT_ID}/messagess:
    delete:
      summary: Delete multiple messages
      operationId: deleteMultipleMessagesV3
      description: 'Deletes up to 25 messages in a chat in a single request. Returns a per-message result indicating success or failure for each ID.


        Admins deleting messages on behalf of other users must supply a reason(an optional comment) can also be provided.


        Threshold limit: 50 requests per min per user


        Number of API calls allowed within a minute.


        Lock period: 5 minutes

        Wait time before consecutive API requests.


        !

        Possible Error Codes

        Click to expand


        Error Code

        Description


        message_delete_limit_exceeded

        You can only delete up to 25 messages at once.


        invalid_parameters

        The message_ids parameter is invalid or empty.


        invalid_delete_reason

        The provided reason for deletion is not valid.


        access_denied

        You do not have permission to delete one or more of the selected messages.


        message_delete_timeout

        The time limit to delete one or more of these messages has expired.


        message_not_found

        Requested message could not be found.


        chat_not_found

        The requested chat does not exist or you are not a participant.


        Error Response Format


        When an error occurs, the API returns a JSON response in this format:


        {"message": "A human-readable description of the error.", "code": "error_code"}


        where code is the error identifier (as listed above) and message is a human-readable explanation of what went wrong.'
      parameters:
      - name: CHAT_ID
        in: path
        required: true
        schema:
          type: string
        example: CHAT_ID
        description: The unique identifier of the chat. To learn how to retrieve this ID, see <a href="/cliq/help/restapi/v3/glossary/#CHAT_ID">CHAT_ID</a> in the Glossary page.
      - name: message_ids
        in: query
        required: true
        schema:
          type: string
        description: 'Comma-separated list of message IDs to delete.<br>

          <b>Maximum of 25 IDs allowed.</b>

          '
      - name: reason
        in: query
        required: false
        schema:
          type: string
          enum:
          - irrelevant_information
          - obscene_content
          - others
        description: "Reason for deletion when an admin is deleting messages on behalf of other users.<br>\n<b>Allowed values:</b><br>\n<ul>\n  <li><code>irrelevant_information</code>: The message contains information that is no longer relevant.</li>\n  <li><code>obscene_content</code>: The message contains inappropriate or offensive content.</li>\n  <li><code>others</code>: Any other reason not covered by the above options.</li>  \n</ul>\n"
      - name: comment
        in: query
        required: false
        schema:
          type: string
          maxLength: 250
        description: 'Optional comment providing additional context for the deletion reason when an admin is deleting messages on behalf of other users.<br>

          <b>Maximum length</b>: 250 characters.

          '
      responses:
        '200':
          description: The request was successfully completed. Returns a per-message result.
          content:
            application/json:
              examples:
                all_success:
                  summary: All messages deleted successfully
                  value:
                    type: message.delete_result
                    data:
                    - id: '1773813859592_51531973059'
                      status: success
                    - id: '1773813860210_51531973060'
                      status: success
                    - id: '1773813861300_51531973061'
                      status: success
                partial_failure:
                  summary: Partial success - one message failed
                  value:
                    type: message.delete_result
                    data:
                    - id: '1773813859592_51531973059'
                      status: success
                    - id: '1773813860210_51531973060'
                      status: success
                    - id: '1773813861300_51531973061'
                      status: failed
                      error:
                        code: access_denied
                        message: You do not have permission to delete this message.
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: message.delete_result
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                          enum:
                          - success
                          - failed
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              examples:
                limit_exceeded:
                  summary: Too many message IDs
                  value:
                    code: message_delete_limit_exceeded
                    message: You can only delete up to 25 messages at once.
                invalid_params:
                  summary: Invalid or empty message_ids
                  value:
                    code: invalid_parameters
                    message: The message_ids parameter is invalid or empty.
                invalid_reason:
                  summary: Invalid delete reason
                  value:
                    code: invalid_delete_reason
                    message: The provided reason for deletion is not valid.
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request was rejected because of invalid AuthToken.
        '403':
          description: Forbidden.
          content:
            application/json:
              examples:
                access_denied:
                  summary: Permission denied
                  value:
                    code: access_denied
                    message: You do not have permission to delete one or more of the selected messages.
                delete_timeout:
                  summary: Delete time limit expired
                  value:
                    code: message_delete_timeout
                    message: The time limit to delete one or more of these messages has expired.
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          description: Not Found.
          content:
            application/json:
              examples:
                message_not_found:
                  summary: Message not found
                  value:
                    code: message_not_found
                    message: Requested message could not be found.
                chat_not_found:
                  summary: Chat not found
                  value:
                    code: chat_not_found
                    message: The requested chat does not exist or you are not a participant.
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too many requests within a certain time frame.
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cliq server encountered an error which prevents it from fulfilling the request.
      security:
      - Cliq_Auth:
        - ZohoCliq.Messages.DELETE
      tags:
      - Messages
  /channelsbyname/{CHANNEL_UNIQUE_NAME}/messages:
    post:
      summary: Post message in a channel with CHANNEL_UNIQUE_NAME
      operationId: postMessageInChannelByChannelUniqueName
      description: 'Use this API to post a message in a channel using its CHANNEL_UNIQUE_NAME.


        You can also post a message using the following alternative endpoint:


        POST /channels/{CHANNEL_ID}/messages - Use the CHANNEL_ID of the channel.


        Threshold limit: 50 requests per min per user


        Number of API calls allowed within a minute.


        This limit is per user, not per token — even if messages are sent using multiple OAuth tokens by the same user, all requests count toward this shared limit.


        Lock period: 10 minutes

        Wait time before consecutive API requests.'
      parameters:
      - name: CHANNEL_UNIQUE_NAME
        in: path
        description: Unique name of the channel. To learn how to retrieve this ID, see <a href="/cliq/help/restapi/v3/glossary/#CHANNEL_UNIQUE_NAME">CHANNEL_UNIQUE_NAME</a> in the Glossary page.
        required: true
        schema:
          type: string
        example: CHANNEL_UNIQUE_NAME
      - name: bot_unique_name
        in: query
        description: Use this parameter to send a message in a channel as a bot. Note that the bot should already be a participant in the channel.
        required: false
        schema:
          type: string
      - name: appkey
        in: query
        description: 'Extension authentication key. Use this along with bot_unique_name when sending messages as an extension bot.

          '
        required: false
        schema:
          type: string
      - name: mark_as_read
        in: query
        description: Use these APIs to mark the sent message as read for the user. By default, the message will be unread for the message posted by the user.
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post-message-in-a-channel-request'
      responses:
        '200':
          description: The request was successfully completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/post-message-in-a-channel-response'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The request cannot be performed. Usually because of malformed parameter or missing parameter.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request was rejected because of invalid AuthToken.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The user does not have enough permission or possibly not an user of the respective organization to access the resource.
        '404':
          description: Invalid URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The URL you've sent is wrong. It's possible that the resource you've requested has been moved to another URL.
        '405':
          description: Method Not Allowed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The requested resource does not support the HTTP method used. For example, requesting List of all customers API with PUT as the HTTP method.
        '406':
          description: Not Acceptable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The response has been received but the requested response type is not supported by the browser.
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too many requests within a certain time frame.
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cliq server encountered an error which prevents it from fulfilling the request.
      security:
      - Cliq_Auth:
        - ZohoCliq.Webhooks.CREATE
      tags:
      - Messages
  /channels/{CHANNEL_ID}/messages:
    post:
      summary: Post message in a channel with CHANNEL_ID
      operationId: postMessageInChannelByChannelId
      description: 'Use this API to post a message in a channel using its CHANNEL_ID.


        You can also post a message using the following alternative endpoint:


        POST /channelsbyname/{CHANNEL_UNIQUE_NAME}/messages - Use the CHANNEL_UNIQUE_NAME of the channel.


        Threshold limit: 50 requests per min per user


        Number of API calls allowed within a minute.


        This limit is per user, not per token — even if messages are sent using multiple OAuth tokens by the same user, all requests count toward this shared limit.


        Lock period: 10 minutes

        Wait time before consecutive API requests.'
      parameters:
      - name: CHANNEL_ID
        in: path
        description: ID of the channel. To learn how to retrieve this ID, see <a href="/cliq/help/restapi/v3/glossary/#CHANNEL_ID">CHANNEL_ID</a> in the Glossary page.
        required: true
        schema:
          type: string
        example: CHANNEL_ID
      - name: bot_unique_name
        in: query
        description: Bot identifier for bot-sent messages. The bot must already be a participant in the channel.
        required: false
        schema:
          type: string
          pattern: ^[a-z]+$
      - name: appkey
        in: query
        description: Extension authentication key. Use this along with bot_unique_name when sending messages as an extension bot.
