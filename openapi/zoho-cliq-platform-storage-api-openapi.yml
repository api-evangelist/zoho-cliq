components:
  schemas:
    platformstorage_records_export:
      type: object
      description: Configuration payload for a Datastore bulk export operation. Specifies the fields to include, filter criteria, and output format.
      required:
      - file_type
      properties:
        file_type:
          type: string
          description: "Format of the exported file.<br>\n<ul>\n <li><b>csv</b>: Comma-separated values format, suitable for spreadsheets and data analysis tools.</li>\n <li><b>xlsx</b>: Microsoft Excel format, supports multiple sheets, formatting, and larger data volumes.</li>\n <li><b>pdf</b>: Portable Document Format, ideal for sharing and printing.</li>\n</ul>\n"
          enum:
          - csv
          - xlsx
          - pdf
        password_protected:
          type: boolean
          description: 'Indicates whether the exported file should be protected with a password. If true, the <code>password</code> field must be provided to specify the password to use for protecting the file.

            '
        password:
          type: string
          minLength: 8
          maxLength: 20
          description: 'Password to protect the exported file. This field is required if <code>password_protected</code> is true.<br>

            Must be between 8 and 20 characters in length and should include a mix of letters, numbers, and special characters for better security.

            <br><b>Minimum length</b>: 8 characters<br>

            <b>Maximum length</b>: 20 characters

            '
    editplatformdatabase_v2:
      type: object
      description: Payload for updating datastore metadata.
      properties:
        unique_name:
          type: string
          maxLength: 20
          description: 'Updated datastore unique name.<br>

            Accepts lowercase letters, numbers, and underscores only, and must start with a letter. This is used in API endpoints and should be unique across datastores.<br>

            <b>Maximum length</b>: 20 characters.

            '
        name:
          type: string
          maxLength: 20
          description: 'Updated datastore display name.<br>

            Can contain letters, numbers, and spaces. This is used for display purposes in the UI and can be non-unique.<br>

            <b>Maximum length</b>: 20 characters.

            '
        description:
          type: string
          maxLength: 250
          description: 'Updated datastore description.<br>

            A brief description about the datastore''s purpose or contents.<br>

            <b>Maximum length</b>: 250 characters.

            '
        unique_keys:
          type: array
          maxItems: 4
          description: "Updated unique key constraints for the datastore. Replaces the existing set of constraints entirely.<br>\n<ul>\n  <li>A maximum of <b>4</b> unique key constraints can be defined per datastore.</li>\n  <li>Each constraint is an array of one or more field <code>unique_name</code> values that must be collectively unique across all records.</li>\n  <li>Fields of type <b>encrypted-text</b> or <b>large-text</b> cannot be included in a unique key constraint.</li>\n</ul>\n"
          items:
            type: array
            description: 'An array of field unique_names that form a single unique key constraint. Each unique key constraint ensures that the combination of values in the specified fields is unique across all records in the datastore.

              '
            items:
              type: string
      example:
        unique_name: empdir
        name: Employee Directory
        description: Tracks employee records and department data
        unique_keys:
        - - empid
          - empname
    datastores_records_add:
      type: object
      description: Payload for inserting or updating a single datastore record.
      required:
      - values
      properties:
        values:
          type: object
          description: 'Key-value pairs of field unique_name and the new value to update.

            '
          additionalProperties: true
          example:
            empid: '1001'
            empname: John Doe
            isactive: true
            salary: '50000'
            department: Engineering
            notes: Senior Engineer in Platform Team
    updaterecord_response:
      type: object
      description: Response envelope returned when a datastore record is retrieved or updated.
      properties:
        url:
          type: string
          description: API endpoint URL for the record resource.
          example: /api/v3/datastores/shejbwfz/records/227828000000128010
        type:
          type: string
          description: Resource type identifier.
          example: datastore_record
        data:
          type: object
          description: The record's field values along with system-managed metadata fields.
          properties:
            modified_time:
              type: string
              description: Unix epoch timestamp (ms) when the record was last modified.
              example: '1777360403455'
            added_time:
              type: string
              description: Unix epoch timestamp (ms) when the record was first created.
              example: '1777360402254'
            id:
              type: string
              description: Unique numeric identifier of the record.
              example: '227828000000128010'
          additionalProperties: true
      example:
        url: /api/v3/datastores/shejbwfz/records/227828000000128010
        type: datastore_record
        data:
          modified_time: '1777360403455'
          empid: '1001'
          isactive: false
          salary: '0'
          department: ''
          id: '227828000000128010'
          empname: John Doe Jr.
          added_time: '1777360402254'
          notes: Senior Engineer in Platform Team
    add_platform_db_fields:
      type: object
      description: Payload for adding new fields to a datastore schema.
      required:
      - fields
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 10
          description: "<ul>\n  <li>List of new fields to add to the datastore.</li>\n  <li>Each field must have a unique_name, name, and type. The new fields will be appended to the existing schema and can be used in subsequent record operations.</li>\n  <li><b>Maximum of 10 fields</b> can be added in a single request.</li>\n</ul>\n"
          items:
            type: object
            required:
            - unique_name
            - name
            - type
            properties:
              unique_name:
                type: string
                maxLength: 20
                description: 'Unique name of the field.<br>

                  Accepts lowercase letters, numbers, and underscores only, and must start with a letter. This is used in API endpoints to reference the field.<br>

                  <b>Maximum length</b>: 20 characters.

                  '
              name:
                type: string
                maxLength: 20
                description: 'Display name of the field.<br>

                  Can contain letters, numbers, and spaces. This is used for display purposes in the UI.<br>

                  <b>Maximum length</b>: 20 characters.

                  '
              type:
                type: string
                description: "Data type of the field.<br>\nDetermines the kind of data that can be stored in this field and the operations that can be performed on it.<br>\n Allowed values:\n <ul>\n   <li><b>boolean</b>: Stores true/false values.</li>\n   <li><b>number</b>: Stores numeric values. Can be used for mathematical operations.</li>\n   <li><b>limited-text</b>: Stores short text up to 250 characters. Cannot be used for full-text search.</li>\n   <li><b>encrypted-text</b>: Stores sensitive text data in encrypted form. Cannot be included in unique key constraints and does not support masking. Maximum length: 1000 characters.</li>\n   <li><b>large-text</b>: Stores long text data up to 65,535 characters. Suitable for descriptions, comments, etc. Cannot be included in unique key constraints.</li>\n </ul>\n <b>Note</b>: The field type cannot be changed after the datastore is created\n"
                enum:
                - boolean
                - number
                - limited-text
                - encrypted-text
                - large-text
              mandatory:
                type: boolean
                description: 'Indicates whether this field is mandatory for each record. If true, a value must be provided for this field when creating or updating records.

                  '
              masked:
                type: boolean
                description: 'Indicates whether this field''s value should be masked (e.g., for sensitive information).<br>

                  <b>Note</b>: Masking is not supported for <b>encrypted-text</b> fields. Encrypted fields are already stored in protected form and cannot be additionally masked.

                  '
              default_value:
                type: string
                maxLength: 100
                description: 'Default value for the field when creating new records. Must be a string representation of a value compatible with the field''s data type. For example, "true" for boolean, "123" for number, etc.<br>

                  <b>Maximum length</b>: 100 characters.

                  '
      example:
        fields:
        - unique_name: join_date
          name: Join Date
          type: limited-text
          mandatory: false
          default_value: ''
        - unique_name: location
          name: Location
          type: limited-text
          mandatory: false
          default_value: ''
