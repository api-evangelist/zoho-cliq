    delete:
      summary: Delete a datastore
      operationId: delete_a_datastore
      description: 'Permanently delete a datastore and all its stored records. This operation is irreversible, and all data in the datastore will be lost. Hence, ensure no active platform components depend on this datastore before deleting it.


        Threshold limit: 10 requests per min per user


        Number of API calls allowed within a minute.


        Lock period: 5 minutes

        Wait time before consecutive API requests.


        !

        Possible Error Codes

        Click to expand


        Error Code

        Description


        datastore_not_found

        Datastore with the given identifier does not exist.


        datastore_access_denied

        The authenticated user does not have permission to delete this datastore.


