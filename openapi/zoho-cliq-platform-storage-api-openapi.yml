  /datastores/{DATASTORE_UNIQUE_NAME}/records:
    patch:
      summary: Bulk update records in a datastore
      operationId: update_records_in_storage
      description: 'Update multiple records in a datastore with a single request. Identify target records by specifying record IDs or a criteria expression in the request body.


        Note: To manage records of a datastore bundled with an extension, use the extension-scoped endpoint instead:

        v3/extensions/{EXTENSION_ID}/datastores/{DATASTORE_UNIQUE_NAME}/records

        and pass the extension_key as a query parameter.


        Threshold limit: 30 requests per min per user


        Number of API calls allowed within a minute.


        Lock period: 5 minutes

        Wait time before consecutive API requests.


        !

        Possible Error Codes

        Click to expand


        Error Code

        Description


        datastore_not_found

        Datastore with the given identifier does not exist.


        datastore_invalid_criteria

        The criteria expression provided is invalid or malformed.


        datastore_criteria_invalid_operator

        The criteria expression uses an invalid or unsupported operator.


        datastore_criteria_limit_exceeded

        The number of conditions in the criteria expression exceeds the allowed limit.


        datastore_column_not_found

        A field key in values or criteria does not match any field unique_name in this datastore.


        datastore_update_violates_unique_key

        The update would violate a unique key constraint defined on the datastore.


        datastore_access_denied

        The authenticated user does not have permission to update records in this datastore.


        Error Response Format


        When an error occurs, the API returns a JSON response in this format:


        {"message": "A human-readable description of the error.", "code": "error_code"}


        where code is the error identifier (as listed above) and message is a human-readable explanation of what went wrong.'
      parameters:
      - name: DATASTORE_UNIQUE_NAME
        in: path
        required: true
        description: 'Unique name of the datastore.<br>

          To learn how to retrieve this, see <a href="/cliq/help/restapi/v3/glossary/#DATABASE_UNIQUE_NAME">DATABASE_UNIQUE_NAME</a> in the Glossary page.''

          '
        schema:
          type: string
        example: DATASTORE_UNIQUE_NAME
      - name: extension_key
        in: query
        required: false
        description: 'Unique key of the extension that the datastore belongs to. Required if the datastore is owned by an extension. To learn how to retrieve this, see <a href="/cliq/help/restapi/v3/glossary/#EXTENSION_KEY">EXTENSION_KEY</a> in the Glossary

          '
        schema:
          type: string
      requestBody:
        description: 'Bulk-updates matching records. Provide a `criteria` expression to select records and `values` with the field updates to apply.

          '
        content:
          application/json:
            schema:
              type: object
              required:
              - criteria
              - values
              properties:
                values:
                  type: object
                  description: 'Key-value pairs of field unique_name and the new value to update.

                    '
                  additionalProperties: true
                  example:
                    isactive: false
                    empname: John Doe
                    notes: Moved to inactive status
                criteria:
                  type: string
                  description: 'Expression to select records for bulk update. Use field <code>unique_name</code>s as keys. Supported comparison operators: <code>=</code>, <code>==</code>, <code>!=</code>, <code>&gt;</code>, <code>&gt;=</code>, <code>&lt;</code>, <code>&lt;=</code>, <code>like</code>, <code>not like</code>, <code>in</code> (max 10 values), <code>not in</code> (max 10 values). Combine conditions with <code>&&</code> (AND) or <code>||</code> (OR), and use parentheses for grouping. Max 10 clauses.<br>

                    '
                  example: (department==Engineering) && (isactive==true)
      responses:
