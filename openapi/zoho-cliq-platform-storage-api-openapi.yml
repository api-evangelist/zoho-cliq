                  name: Employee Directory
                  id: '227828000000132001'
                  creator:
                    name: NP NTC
                    id: '119440882'
                  status: enabled
                  fields:
                  - default_value: ''
                    masked: false
                    name: Department
                    unique_name: department
                    type: limited-text
                    mandatory: false
                    id: '17202020414617773604018030'
                  - default_value: ''
                    masked: false
