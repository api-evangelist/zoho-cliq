    get:
      summary: List records from a datastore
      operationId: get_records
      description: "Retrieve records from a datastore with optional filtering, sorting, and pagination.\n<ul>\n  <li>Use the <code>criteria</code> query parameter to filter records based on field values (e.g. <code>(empname=John) && (isactive=true)</code>).</li>\n  <li>Use the <code>sync_token</code> parameter to retrieve records modified before a certain point in time, or the <code>next_token</code> parameter for records modified after a certain point in time. This is useful for incremental synchronization.</li>\n  <li>Use the <code>order_by</code> parameter to sort results by specific fields.</li>\n  <li>Use the <code>limit</code> parameter to restrict the number of records returned.</li>\n</ul>\n<blockquote><b>Note</b>: To manage records of a datastore bundled with an extension, use the extension-scoped endpoint instead:<br><code>v3/extensions/{EXTENSION_ID}/datastores/{DATASTORE_UNIQUE_NAME}/records</code><br>and pass the <code>extension_key</code> as a query parameter.</blockquote>\n<br><br>\n<p>\n  <b>Threshold limit</b>: 30 requests per min per user<br>\n  Number of API calls allowed within a minute.<br><br>\n  <b>Lock period</b>: 5 minutes<br>Wait time before consecutive API requests.<br>\n</p>\n<details style=\"margin:16px 0 8px 0; border:1px solid rgba(148,163,184,0.5); border-radius:8px; font-family:inherit;\" ontoggle=\"this.querySelector('.err-toggle-hint').textContent=this.open?'Click to collapse':'Click to expand'\">\n  <summary style=\"cursor:pointer; padding:11px 16px; font-weight:600; background:rgba(148,163,184,0.1); list-style:none; display:flex; align-items:center; gap:8px; user-select:none; border-radius:8px;\">\n    <span style=\"display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; background:rgba(239,68,68,0.15); border-radius:50%; font-size:12px; font-weight:700; color:#ef4444; flex-shrink:0;\">!</span>\n    Possible Error Codes\n    <span class=\"err-toggle-hint\" style=\"margin-left:auto; font-weight:400; opacity:0.45; font-size:0.8em; letter-spacing:0.01em;\">Click to expand</span>\n  </summary>\n  <div style=\"padding:14px 16px 16px 16px;\">\n    <div style=\"border-radius:6px; border:1px solid rgba(148,163,184,0.35);\">\n      <table style=\"border-collapse:collapse; width:100%; font-family:inherit; font-size:0.9em;\">\n        <thead>\n          <tr>\n            <th style=\"padding:10px 18px; text-align:center; background:rgba(148,163,184,0.15); border-bottom:1px solid rgba(148,163,184,0.35); border-right:1px solid rgba(148,163,184,0.35); font-weight:600; width:45%;\">Error Code</th>\n            <th style=\"padding:10px 18px; text-align:center; background:rgba(148,163,184,0.15); border-bottom:1px solid rgba(148,163,184,0.35); font-weight:600; width:55%;\">Description</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2); border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">datastore_not_found</span></td>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2);\">Datastore with the given identifier does not exist.</td>\n          </tr>\n          <tr style=\"background:rgba(148,163,184,0.05);\">\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2); border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">datastore_invalid_criteria</span></td>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2);\">The criteria expression provided is invalid or malformed.</td>\n          </tr>\n          <tr>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2); border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">datastore_criteria_invalid_operator</span></td>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2);\">The criteria expression uses an invalid or unsupported operator.</td>\n          </tr>\n          <tr style=\"background:rgba(148,163,184,0.05);\">\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2); border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">datastore_criteria_limit_exceeded</span></td>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2);\">The number of conditions in the criteria expression exceeds the allowed limit.</td>\n          </tr>\n          <tr>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2); border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">datastore_column_not_found</span></td>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2);\">A field used in the criteria does not exist in this datastore.</td>\n          </tr>\n          <tr style=\"background:rgba(148,163,184,0.05);\">\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2); border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">datastore_invalid_next_token</span></td>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2);\">The <code>next_token</code> value provided is invalid or expired.</td>\n          </tr>\n          <tr>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2); border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">datastore_invalid_number_value</span></td>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2);\">A value used in the criteria for a number-type field is not a valid number.</td>\n          </tr>\n          <tr style=\"background:rgba(148,163,184,0.05);\">\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2); border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">datastore_in_query_limit_exceeded</span></td>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2);\">The number of values in an <code>in</code> query exceeds the allowed limit.</td>\n          </tr>\n          <tr>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2); border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">datastore_duplicate_sort_field</span></td>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2);\">The same field was specified more than once in the <code>order_by</code> parameter.</td>\n          </tr>\n          <tr style=\"background:rgba(148,163,184,0.05);\">\n            <td style=\"padding:10px 18px; border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">datastore_access_denied</span></td>\n            <td style=\"padding:10px 18px;\">The authenticated user does not have permission to read records from this datastore.</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <div style=\"background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.4); border-left:4px solid #f59e0b; padding:12px 16px; border-radius:0 6px 6px 0; margin-top:14px; overflow:hidden;\">\n      <b style=\"color:#d97706; font-size:0.88em; display:block; margin-bottom:6px;\">Error Response Format</b>\n      <p style=\"margin:0 0 8px 0; font-size:0.85em; opacity:0.75;\">When an error occurs, the API returns a JSON response in this format:</p>\n      <code style=\"display:block; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); padding:8px 12px; border-radius:4px; font-size:0.75em; word-break:break-all;\">{\"message\": \"A human-readable description of the error.\", \"code\": \"error_code\"}</code>\n      <p style=\"margin:8px 0 0 0; font-size:0.85em; opacity:0.75;\">where <code style=\"background:rgba(245,158,11,0.1); padding:1px 5px; border-radius:3px;\">code</code> is the error identifier (as listed above) and <code style=\"background:rgba(245,158,11,0.1); padding:1px 5px; border-radius:3px;\">message</code> is a human-readable explanation of what went wrong.</p>\n    </div>\n  </div>\n</details>\n"
      parameters:
      - name: DATASTORE_UNIQUE_NAME
        in: path
        required: true
        description: 'Unique name of the datastore.<br>

          To learn how to retrieve this, see <a href="/cliq/help/restapi/v3/glossary/#DATABASE_UNIQUE_NAME">DATABASE_UNIQUE_NAME</a> in the Glossary page.

          '
        schema:
          type: string
        example: DATASTORE_UNIQUE_NAME
      - name: criteria
        in: query
        required: false
        description: "Expression to filter records. Use field <code>unique_name</code>s as keys. Wrap each condition in parentheses and combine with <code>&&</code> / <code>||</code>.<br>\nExample: <code>(empname=John) && (isactive=true)</code>\n<br>\n<br><b>Supported Comparison Operators</b><br><br>\n<table style=\"border-collapse: collapse; width: 100%; font-family: inherit;\">\n  <tr>\n    <th style=\"padding: 8px; text-align: center; border: 1px solid #ddd; font-family: inherit;\">Operator</th>\n    <th style=\"padding: 8px; text-align: center; border: 1px solid #ddd; font-family: inherit;\">Meaning</th>\n    <th style=\"padding: 8px; text-align: center; border: 1px solid #ddd; font-family: inherit;\">Notes</th>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>=</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Equal</td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"></td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>==</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Equal</td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Alias for <code>=</code></td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>!=</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Not Equal</td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"></td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>&gt;</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Greater Than</td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"></td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>&gt;=</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Greater Than or Equal</td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"></td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>&lt;</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Less Than</td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"></td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>&lt;=</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Less Than or Equal</td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"></td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>like</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Like (pattern match)</td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Case-insensitive, only for CHAR fields</td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>not like</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Not Like</td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Case-insensitive, only for CHAR fields</td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>in</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">In (multi-value)</td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Comma-separated values, max <b>10</b> values</td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>not in</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Not In</td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Comma-separated values, max <b>10</b> values</td>\n  </tr>\n</table>\n<br><b>Logical Operators (for combining criteria)</b><br><br>\n<table style=\"border-collapse: collapse; width: 100%; font-family: inherit;\">\n  <tr>\n    <th style=\"padding: 8px; text-align: center; border: 1px solid #ddd; font-family: inherit;\">Operator</th>\n    <th style=\"padding: 8px; text-align: center; border: 1px solid #ddd; font-family: inherit;\">Meaning</th>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>&&</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">AND</td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>||</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">OR</td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>( )</code></td>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\">Grouping / parentheses for precedence</td>\n  </tr>\n</table>\n<br><b>AND</b> has higher priority than <b>OR</b> (standard precedence).<br>\n<br><b>Limits</b>\n<ul>\n  <li><b>Max criteria clauses</b>: 10 (combined with <code>&&</code> / <code>||</code>)</li>\n  <li><b>Max values in <code>in</code> / <code>not in</code></b>: 10</li>\n</ul>\n"
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: 'Maximum number of records to return.<br>

          <b>Default</b>: 50<br>

          <b>Maximum</b>: 100<br>

          '
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: order_by
        in: query
        required: false
        description: 'Comma-separated list of fields to sort by, with optional sort direction (asc or desc).<br>

          If sort direction is not specified, ascending order is used by default.<br>

          Example: <code>empname desc, empid asc</code><br>

          <b>Example syntax</b>: +timestamp (e.g. <code>+1777360402254</code>) to get records modified before the specified timestamp, or -age (e.g. <code>-3600000</code>) to get records modified within the last hour.

          '
        schema:
          type: string
      - name: sync_token
        in: query
        required: false
        description: 'Token to retrieve records modified before a certain point in time. This is useful for incremental synchronization. The token value should be the <code>sync_token</code> returned in a previous response, which encodes a timestamp. Records modified before that timestamp will be returned.<br>

          '
        schema:
          type: string
      - name: next_token
        in: query
        required: false
        description: 'Token to retrieve records modified after a certain point in time. This is useful for incremental synchronization. The token value should be the <code>sync_token</code> returned in a previous response, which encodes a timestamp. Records modified after that timestamp will be returned.

          '
        schema:
          type: string
      - name: extension_key
        in: query
        required: false
        description: 'Unique key of the extension that the datastore belongs to. Required if the datastore is owned by an extension. To learn how to retrieve this, see <a href="/cliq/help/restapi/v3/glossary/#EXTENSION_KEY">EXTENSION_KEY</a> in the Glossary page.

          '
        schema:
          type: string
      responses:
        '200':
          description: Records returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listrecords_response'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The request cannot be performed. Usually because of malformed parameter or missing parameter.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request was rejected because of invalid AuthToken.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The user does not have enough permission or possibly not an user of the respective organization to access the resource.
        '404':
          description: Invalid URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The URL you've sent is wrong. It's possible that the resource you've requested has been moved to another URL.
        '405':
          description: Method Not Allowed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The requested resource does not support the HTTP method used. For example, requesting List of all customers API with PUT as the HTTP method.
        '406':
          description: Not Acceptable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The response has been received but the requested response type is not supported by the browser.
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too many requests within a certain time frame.
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cliq server encountered an error which prevents it from fulfilling the request.
      security:
      - Cliq_Auth:
        - DatastoreRecords.READ
      tags:
      - Platform_storage
    delete:
      summary: Delete records from a datastore
      operationId: delete_records_of_given_ids_in
      description: "Delete one or more records from a datastore. Specify the records to delete by providing comma-separated record <code>ids</code> in the query string, or by providing a <code>criteria</code> expression to match records. Deletions are irreversible.\n<br><br>\n<blockquote><b>Note</b>: To manage records of a datastore bundled with an extension, use the extension-scoped endpoint instead:<br><code>v3/extensions/{EXTENSION_ID}/datastores/{DATASTORE_UNIQUE_NAME}/records</code><br>and pass the <code>extension_key</code> as a query parameter.</blockquote>\n<br><br>\n<p>\n  <b>Threshold limit</b>: 30 requests per min per user<br>\n  Number of API calls allowed within a minute.<br><br>\n  <b>Lock period</b>: 5 minutes<br>Wait time before consecutive API requests.<br>\n</p>\n"
      parameters:
      - name: DATASTORE_UNIQUE_NAME
        in: path
        required: true
        description: Unique name of the datastore. To learn how to retrieve this, see <a href="/cliq/help/restapi/v3/glossary/#DATABASE_UNIQUE_NAME">DATABASE_UNIQUE_NAME</a> in the Glossary page.
        schema:
          type: string
        example: DATASTORE_UNIQUE_NAME
      - schema:
          description: ''
          type: string
        in: query
        name: criteria
        description: 'Expression to select records for bulk deletion. Use field <code>unique_name</code>s as keys. Supported comparison operators: <code>=</code>, <code>==</code>, <code>!=</code>, <code>&gt;</code>, <code>&gt;=</code>, <code>&lt;</code>, <code>&lt;=</code>, <code>like</code>, <code>not like</code>, <code>in</code> (max 10 values), <code>not in</code> (max 10 values). Combine conditions with <code>&&</code> (AND) or <code>||</code> (OR), and use parentheses for grouping. Max 10 clauses.

          '
        required: false
      - schema:
          description: ''
          $ref: '#/components/schemas/multiplelong_regex'
        in: query
        name: ids
        description: ids of the records to be deleted
        required: false
      - schema:
          description: ''
          $ref: '#/components/schemas/encryptedappkey_regex'
        in: query
        name: extension_key
        description: Encrypted app id
        required: false
      responses:
        '204':
          description: No Content. Records deleted successfully.
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The request cannot be performed. Usually because of malformed parameter or missing parameter.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request was rejected because of invalid AuthToken.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The user does not have enough permission or possibly not an user of the respective organization to access the resource.
        '404':
          description: Invalid URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The URL you've sent is wrong. It's possible that the resource you've requested has been moved to another URL.
