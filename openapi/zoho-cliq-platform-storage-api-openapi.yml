                  creator:
                    name: NP NTC
                    id: '119440882'
                  status: enabled
                  fields:
                  - default_value: ''
                    masked: false
                    name: Notes
                    unique_name: notes
                    type: large-text
                    mandatory: false
                    id: '17202020414617773604009000'
                  - default_value: '0'
                    masked: false
                    name: Employee ID
                    unique_name: empid
                    type: number
                    mandatory: true
                    id: '17202020414617773604009001'
                  - default_value: ''
                    masked: false
                    name: Employee Name
                    unique_name: empname
                    type: limited-text
                    mandatory: true
                    id: '17202020414617773604009002'
                  - default_value: 'true'
                    masked: false
                    name: Active Status
                    unique_name: isactive
