openapi: 3.2.0
info:
  title: Datastores Platform Storage API
  version: '3.0'
  description: 'Cliq Database serves as an ideal storage interface for building integrations on the Cliq Platform. It allows you to create, modify, store, and synchronize easily accessible data items.


    You can access the Cliq Record APIs using the following OAuth scope:


    OAuth Scope for Record APIs: ZohoCliq.Datastores.ALL , ZohoCliq.DatastoreRecords.ALL


    This scope provides basic CRUD (Create, Read, Update, Delete) access to the Record APIs.'
servers:
- url: https://cliq.zoho.com/api/v3
  description: Zoho Cliq US DC
tags:
- name: Platform_storage
  description: Manage Cliq Datastores - structured, schema-defined storage tables scoped to an organisation or extension. Datastores allow platform components to persist and query structured data across executions. Each datastore has typed fields and supports CRUD operations, field schema management, bulk record exports, and criteria-based queries.
paths:
  /datastores:
    post:
      summary: Create a datastore
      operationId: creating_datastores_for_an_org
      description: 'Create a new Datastore for the organisation.


        A Datastore is a structured storage table scoped to the organisation (or an extension) that allows platform components to persist and query data across executions.


        Threshold limit: 10 requests per min per user


        Number of API calls allowed within a minute.


        Lock period: 5 minutes

        Wait time before consecutive API requests.


        !

        Possible Error Codes

        Click to expand


        Error Code

        Description


        datastore_creation_limit_exceeded

        The maximum number of datastores allowed for the organisation has been reached.


        datastore_name_already_exists

        A datastore with the same name already exists in the organisation.


        datastore_invalid_creation_data

        The request body contains invalid or malformed data for datastore creation.


        datastore_fields_required

        At least one field definition must be provided to create a datastore.


        datastore_fields_invalid_value

        One or more field definitions contain an invalid value.


        datastore_fields_limit_exceeded

        The number of fields exceeds the maximum limit of 19 (plus the default record ID field).


        datastore_fields_duplicate_column

        Two or more fields share the same column name. Field names must be unique within a datastore.


        datastore_access_denied

        The authenticated user does not have permission to create a datastore.


        datastore_unique_key_column_not_found

        A field referenced in a unique key constraint does not exist in the datastore''s field definitions.


        datastore_field_name_reserved

        One or more field names use a reserved keyword that cannot be used as a field name.


        datastore_field_unique_key_not_supported

        A field of type encrypted-text or large-text was included in a unique key constraint, which is not supported.


        datastore_field_mask_not_supported

        Masking was specified for a field type that does not support it. Only limited-text and number fields support masking.


        datastore_invalid

        The datastore data is invalid or in an unexpected state.


        Error Response Format


        When an error occurs, the API returns a JSON response in this format:


        {"message": "A human-readable description of the error.", "code": "error_code"}


        where code is the error identifier (as listed above) and message is a human-readable explanation of what went wrong.'
      parameters: []
      requestBody:
        description: Creates a datastore. Provide `unique_name`, `name`, `description`, and at least one field definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createplatformdatabase_v2'
        required: true
      responses:
        '200':
          description: Datastore created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatastoreResponse'
              example:
                url: /api/v3/datastores
                type: datastore
                data:
                  unique_name: empdir
                  name: Employee Directory
                  id: '227828000000132001'
                  creator:
                    name: NP NTC
                    id: '119440882'
                  status: enabled
                  fields:
                  - default_value: ''
                    masked: false
                    name: Notes
                    unique_name: notes
                    type: large-text
                    mandatory: false
                    id: '17202020414617773604009000'
                  - default_value: '0'
                    masked: false
                    name: Employee ID
                    unique_name: empid
                    type: number
                    mandatory: true
                    id: '17202020414617773604009001'
                  - default_value: ''
                    masked: false
                    name: Employee Name
                    unique_name: empname
                    type: limited-text
                    mandatory: true
                    id: '17202020414617773604009002'
                  - default_value: 'true'
                    masked: false
                    name: Active Status
                    unique_name: isactive
                    type: boolean
                    mandatory: false
                    id: '17202020414617773604009003'
                  type: custom
                  description: V3 API test datastore
                  unique_keys:
                  - - empid
                  scope: personal
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The request cannot be performed. Usually because of malformed parameter or missing parameter.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request was rejected because of invalid AuthToken.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The user does not have enough permission or possibly not an user of the respective organization to access the resource.
        '404':
          description: Invalid URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The URL you've sent is wrong. It's possible that the resource you've requested has been moved to another URL.
        '405':
          description: Method Not Allowed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The requested resource does not support the HTTP method used. For example, requesting List of all customers API with PUT as the HTTP method.
        '406':
          description: Not Acceptable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The response has been received but the requested response type is not supported by the browser.
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too many requests within a certain time frame.
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cliq server encountered an error which prevents it from fulfilling the request.
      security:
      - Cliq_Auth:
        - Datastores.CREATE
      tags:
      - Platform_storage
    get:
      summary: List all datastores
      operationId: get_list_of_datastores
      description: 'Retrieve a paginated list of all datastores defined for the organisation.


        Threshold limit: 30 requests per min per user


        Number of API calls allowed within a minute.


        Lock period: 5 minutes

        Wait time before consecutive API requests.


        !

        Possible Error Codes

        Click to expand


        Error Code

        Description


        bulk_record_update_failed

        Failed to update one or more records.


        invalid_record_criteria

        Criteria expression is invalid.


        datastore_not_found

        Datastore with the given identifier does not exist.


        Error Response Format


        When an error occurs, the API returns a JSON response in this format:


        {"message": "A human-readable description of the error.", "code": "error_code"}


        where code is the error identifier (as listed above) and message is a human-readable explanation of what went wrong.'
      parameters:
      - schema:
          description: ''
          $ref: '#/components/schemas/base64_regex'
        in: query
        name: sync_token
        description: 'Return datastores modified after the given sync token. The sync token is returned in the response when fetching the list of datastores, and can be used to retrieve only datastores that were created or updated after that request.

          '
        required: false
      - schema:
          description: ''
          type: integer
        in: query
        name: limit
        description: 'Maximum number of datastores to return in the response. Default is 20, maximum allowed value is 100.

          '
        required: false
      - schema:
          description: ''
          $ref: '#/components/schemas/base64_regex'
        in: query
        name: next_token
        description: 'Token to retrieve the next page of results. This is returned in the response when the number of datastores exceeds the specified limit. To fetch the next page, include this token in the request.

          '
        required: false
      responses:
        '200':
          description: List of datastores returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatastoreResponse'
              example:
                url: /api/v3/datastores
                type: datastore
                sync_token: MTB8MTc3NzM2MDM5OTc0OXw=
                data:
                - unique_name: empdir
                  name: Employee Directory
                  id: '227828000000132001'
                  creator:
                    name: NP NTC
