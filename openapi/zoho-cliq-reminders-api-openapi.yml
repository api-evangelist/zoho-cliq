                    - status: success
                      reminder_id: '1901318000012651016'
                      data:
                        id: '1901318000012651016'
                        time: '2026-06-04T20:30:00-07:00'
                        timezone: Asia/Kolkata
                        completed: false
                        creation_time: '2026-05-29T03:53:32-07:00'
