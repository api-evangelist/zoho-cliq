  /messageactions/{MESSAGE_ACTION_ID}:
    patch:
      summary: Update an existing message action
      operationId: update_an_existing_message_act
      description: 'Update the configuration of an existing message action.


        All fields are optional. Only the fields you provide will be updated; omitted fields remain unchanged.


        For Webhook message actions, you can update the execution_url independently at any time to redirect the action to a new server endpoint.


        Threshold limit: 10 requests per min per user


        Maximum API calls allowed within one minute.


        Lock period: 5 minutes

        Cooldown period applied after threshold exhaustion.


        !

        Possible Error Codes

        Click to expand


        Error Code

        Description


        msgaction_not_found

        Message action with the specified ID was not found.


        msgaction_name_already_exists

        Another message action with this name already exists.


        Error Response Format


        When an error occurs, the API returns a JSON response in this format:


        {"message": "A human-readable description of the error.", "code": "error_code"}


        where code is the error identifier (as listed above) and message is a human-readable explanation of what went wrong.'
      parameters:
      - schema:
          description: ''
          $ref: '#/components/schemas/longid_regex'
        example: MESSAGE_ACTION_ID
        in: path
        name: MESSAGE_ACTION_ID
        description: 'Unique numeric identifier of the message action.<br>

          To learn how to retrieve this ID, see <a href="/cliq/help/restapi/v3/glossary/#MESSAGE_ACTION_ID">MESSAGE_ACTION_ID</a> in the Glossary page.''

          '
        required: true
      requestBody:
        description: Updates a message action. Send only fields to change. For Webhook actions, use `execution_url` to update the server endpoint.
        required: true
        content:
          application/json:
            examples:
              update_details:
                summary: Update action details
                value:
                  name: Create Ticket
                  hint: Convert this message into a support ticket - updated
                  scope: organization
                  multi_selectable: false
                  message_types:
                  - text
                  - link
                  - attachment
              update_webhook_url:
                summary: Update webhook execution URL
                value:
                  execution_url: https://api.yourcompany.com/cliq/messageactions/updated-handler
              update_scope_to_team:
                summary: Update scope to team
                value:
                  scope: team
                  team_ids:
                  - 100001
                  - 100002
                  multi_selectable: true
                  message_types:
                  - text
            schema:
              $ref: '#/components/schemas/v3-msgaction-edit'
      responses:
        '200':
          description: Message action updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageActionUpdateResponse'
              examples:
                update_all_fields:
                  summary: Update All Fields response
                  value:
                    url: /api/v3/messageactions/53719000002124010
                    type: messageaction
                    data:
                      name: Create Ticket
                      id: '53719000002124010'
                      hint: Convert this message into a support ticket
                      scope: organization
                      multi_selectable: false
                      message_types:
                      - text
                      - link
                      - attachment
                      handlers:
                      - type: execution_handler
                      creator:
                        name: James
                        id: '65113112'
                      execution_type: deluge
                      status: enabled
                      type: custom
                update_hint_only:
                  summary: Update Hint Only response
                  value:
                    url: /api/v3/messageactions/53719000002124011
                    type: messageaction
                    data:
                      name: Flag Message
                      id: '53719000002124011'
                      hint: Flag this message for review
                      scope: organization
                      multi_selectable: false
                      message_types:
                      - text
                      - link
                      - attachment
                      handlers:
                      - type: execution_handler
                      creator:
                        name: James
                        id: '65113112'
                      execution_type: deluge
                      status: enabled
                      type: custom
                update_scope_to_team:
                  summary: Update Scope to Team response
                  value:
                    url: /api/v3/messageactions/53719000002124012
                    type: messageaction
                    data:
                      name: Bulk Archive
                      id: '53719000002124012'
                      hint: Archive selected messages
                      scope: team
                      team_ids:
                      - 100001
                      - 100002
                      multi_selectable: true
                      message_types:
                      - text
                      handlers:
                      - type: execution_handler
                      creator:
                        name: James
                        id: '65113112'
                      execution_type: deluge
                      status: enabled
                      type: custom
                update_message_types:
                  summary: Update Message Types response
                  value:
                    url: /api/v3/messageactions/53719000002124013
                    type: messageaction
                    data:
                      name: Translate
                      id: '53719000002124013'
                      hint: Translate selected message to English
                      scope: personal
                      multi_selectable: false
                      message_types:
                      - text
                      handlers:
                      - type: execution_handler
                      creator:
                        name: James
                        id: '65113112'
                      execution_type: deluge
                      status: enabled
                      type: custom
        '400':
          description: Bad Request.
          content:
