  /messageactions/{MESSAGE_ACTION_ID}/handlers/{HANDLER_TYPE}:
    patch:
      summary: Update a handler for a specific message action
      operationId: updateMessageActionHandler
      description: 'Update a handler for a specific message action. What you provide depends on the action''s execution type:


        Deluge message action: Update the script attribute with the revised Deluge source code to execute when the action fires.


        Webhook message action: Update the permissions array to change which data attributes are forwarded to your server. All 5 permissions are available for message action handlers.


        Threshold limit: 10 requests per min per user


        Maximum API calls allowed within one minute.


        Lock period: 5 minutes

        Cooldown period applied after threshold exhaustion.


        !

        Possible Error Codes

        Click to expand


        Error Code

        Description


        execution_handler_update_failed

        Failed to update the execution handler.


        execution_handler_not_found

        Specified handler was not found for this message action.


        Error Response Format


        When an error occurs, the API returns a JSON response in this format:


        {"message": "A human-readable description of the error.", "code": "error_code"}


        where code is the error identifier (as listed above) and message is a human-readable explanation of what went wrong.'
      parameters:
      - schema:
          description: ''
          $ref: '#/components/schemas/HANDLER_TYPE_regex'
        example: HANDLER_TYPE
        in: path
        name: HANDLER_TYPE
        description: Type of the message action handler. The only supported value is <code>execution_handler</code>, which is triggered when the message action is invoked.
        required: true
      - schema:
          description: ''
          $ref: '#/components/schemas/longid_regex'
        example: MESSAGE_ACTION_ID
