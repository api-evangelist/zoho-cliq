      description: "<a id=\"createCommandHandler\"></a>\n<p>\n  Add a new handler to an existing slash command. Commands support two handler types:\n</p>\n<ul>\n  <li><b>Execution handler</b>: Executes the command's primary function when invoked.</li>\n  <li><b>Suggestion handler</b>: Provides dynamic autocomplete suggestions as users type the command.</li>\n</ul>\n<p>\n  The field you provide depends on the command's execution type:\n</p>\n<ul>\n  <li><b>Deluge command</b>: Provide the <code>script</code> field with the Deluge source code to execute when the handler fires.</li>\n  <li><b>Webhook command</b>: Provide the <code>permissions</code> field - an array of data attributes your server needs to receive in the webhook payload. Do not pass <code>script</code> for Webhook commands.</li>\n</ul>\n<p><b>Permissions availability by handler type</b></p>\n<table style=\"border-collapse: collapse; width: 100%; font-family: inherit;\">\n  <tr>\n    <th style=\"padding: 8px; text-align: left; border: 1px solid #ddd; font-family: inherit;\">Handler</th>\n    <th style=\"padding: 8px; text-align: center; border: 1px solid #ddd; font-family: inherit; white-space: nowrap;\"><code>attachments</code></th>\n    <th style=\"padding: 8px; text-align: center; border: 1px solid #ddd; font-family: inherit;\"><code>chat</code></th>\n    <th style=\"padding: 8px; text-align: center; border: 1px solid #ddd; font-family: inherit;\"><code>location</code></th>\n    <th style=\"padding: 8px; text-align: center; border: 1px solid #ddd; font-family: inherit;\"><code>user</code></th>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>execution_handler</code></td>\n    <td style=\"padding: 8px; text-align: center; border: 1px solid #ddd;\">&#10003;</td>\n    <td style=\"padding: 8px; text-align: center; border: 1px solid #ddd;\">&#10003;</td>\n    <td style=\"padding: 8px; text-align: center; border: 1px solid #ddd;\">&#10003;</td>\n    <td style=\"padding: 8px; text-align: center; border: 1px solid #ddd;\">&#10003;</td>\n  </tr>\n  <tr>\n    <td style=\"padding: 8px; border: 1px solid #ddd;\"><code>suggestion_handler</code></td>\n    <td style=\"padding: 8px; text-align: center; border: 1px solid #ddd;\">-</td>\n    <td style=\"padding: 8px; text-align: center; border: 1px solid #ddd;\">&#10003;</td>\n    <td style=\"padding: 8px; text-align: center; border: 1px solid #ddd;\">&#10003;</td>\n    <td style=\"padding: 8px; text-align: center; border: 1px solid #ddd;\">&#10003;</td>\n  </tr>\n</table>\n<p>Note: <code>attachments</code> is not available for <code>suggestion_handler</code>. All permissions are available for <code>execution_handler</code>.</p>\n<br>\n<p>\n  <b>Threshold limit</b>: 10 requests per min per user<br>\n  Maximum API calls allowed within one minute.<br><br>\n  <b>Lock period</b>: 5 minutes<br>Cooldown period applied after threshold exhaustion.<br>\n</p>\n<details style=\"margin:16px 0 8px 0; border:1px solid rgba(148,163,184,0.5); border-radius:8px; font-family:inherit;\" ontoggle=\"this.querySelector('.err-toggle-hint').textContent=this.open?'Click to collapse':'Click to expand'\">\n  <summary style=\"cursor:pointer; padding:11px 16px; font-weight:600; background:rgba(148,163,184,0.1); list-style:none; display:flex; align-items:center; gap:8px; user-select:none; border-radius:8px;\">\n    <span style=\"display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; background:rgba(239,68,68,0.15); border-radius:50%; font-size:12px; font-weight:700; color:#ef4444; flex-shrink:0;\">!</span>\n    Possible Error Codes\n    <span class=\"err-toggle-hint\" style=\"margin-left:auto; font-weight:400; opacity:0.45; font-size:0.8em; letter-spacing:0.01em;\">Click to expand</span>\n  </summary>\n  <div style=\"padding:14px 16px 16px 16px;\">\n    <div style=\"border-radius:6px; border:1px solid rgba(148,163,184,0.35);\">\n      <table style=\"border-collapse:collapse; width:100%; font-family:inherit; font-size:0.9em;\">\n        <thead>\n          <tr>\n            <th style=\"padding:10px 18px; text-align:center; background:rgba(148,163,184,0.15); border-bottom:1px solid rgba(148,163,184,0.35); border-right:1px solid rgba(148,163,184,0.35); font-weight:600; width:45%;\">Error Code</th>\n            <th style=\"padding:10px 18px; text-align:center; background:rgba(148,163,184,0.15); border-bottom:1px solid rgba(148,163,184,0.35); font-weight:600; width:55%;\">Description</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2); border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">execution_handler_create_failed</span></td>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2);\">Failed to create the handler.</td>\n          </tr>\n          <tr style=\"background:rgba(148,163,184,0.05);\">\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2); border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">execution_handler_data_required</span></td>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2);\">Required field missing.</td>\n          </tr>\n          <tr>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2); border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">execution_handler_data_invalid</span></td>\n            <td style=\"padding:10px 18px; border-bottom:1px solid rgba(148,163,184,0.2);\">Handler data is invalid.</td>\n          </tr>\n          <tr style=\"background:rgba(148,163,184,0.05);\">\n            <td style=\"padding:10px 18px; border-right:1px solid rgba(148,163,184,0.25); vertical-align:middle;\"><span style=\"display:inline-block; background:rgba(239,68,68,0.12); color:#ef4444; padding:3px 10px; border-radius:4px; font-family:monospace; font-size:0.82em; line-height:1.6; word-break:break-all;\">invalid_inputs</span></td>\n            <td style=\"padding:10px 18px;\">Invalid handler type or bad request body.</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <div style=\"background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.4); border-left:4px solid #f59e0b; padding:12px 16px; border-radius:0 6px 6px 0; margin-top:14px; overflow:hidden;\">\n      <b style=\"color:#d97706; font-size:0.88em; display:block; margin-bottom:6px;\">Error Response Format</b>\n      <p style=\"margin:0 0 8px 0; font-size:0.85em; opacity:0.75;\">When an error occurs, the API returns a JSON response in this format:</p>\n      <code style=\"display:block; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); padding:8px 12px; border-radius:4px; font-size:0.75em; word-break:break-all;\">{\"message\": \"A human-readable description of the error.\", \"code\": \"error_code\"}</code>\n      <p style=\"margin:8px 0 0 0; font-size:0.85em; opacity:0.75;\">where <code style=\"background:rgba(245,158,11,0.1); padding:1px 5px; border-radius:3px;\">code</code> is the error identifier (as listed above) and <code style=\"background:rgba(245,158,11,0.1); padding:1px 5px; border-radius:3px;\">message</code> is a human-readable explanation of what went wrong.</p>\n    </div>\n  </div>\n</details>\n"
      parameters:
      - schema:
          description: ''
          $ref: '#/components/schemas/longid_regex'
        example: SLASH_COMMAND_ID
        in: path
        name: SLASH_COMMAND_ID
        description: 'Unique numeric identifier of the slash command.<br>

          To learn how to retrieve this ID, see <a href="/cliq/help/restapi/v3/glossary/#SLASH_COMMAND_ID">SLASH_COMMAND_ID</a> in the Glossary page.''

          '
        required: true
      requestBody:
        description: Creates a slash-command handler. For Deluge commands, provide `type` and `script`. For Webhook commands, provide `type` and `permissions`.
        required: true
        content:
          application/json:
            examples:
              execution_handler_deluge:
                summary: Execution handler - Deluge command
                description: Provide `script` with the Deluge source code. Runs directly on Zoho's platform.
                value:
                  type: execution_handler
                  script: 'response = Map();

                    user = info.get("user_info").get("name");

                    response.put("text", "Hello, " + user + "! Support ticket created.");

                    return response;

                    '
              execution_handler_webhook:
                summary: Execution handler - Webhook command
                description: Provide `permissions` to specify the data your server needs. Cliq will forward these to your `execution_url`.
                value:
                  type: execution_handler
                  permissions:
                  - chat
                  - user
              suggestion_handler_deluge:
                summary: Suggestion handler - Deluge command
                description: Runs to generate autocomplete suggestions as users type the command.
                value:
                  type: suggestion_handler
                  script: 'suggestions = List();

                    suggestions.add({"value": "create", "label": "Create a new ticket"});

                    suggestions.add({"value": "lookup", "label": "Look up an existing ticket"});

                    return {"suggestions": suggestions};

                    '
              suggestion_handler_webhook:
                summary: Suggestion handler - Webhook command
                description: Webhook commands route suggestion requests to your `execution_url` with the configured permissions.
                value:
                  type: suggestion_handler
                  permissions:
                  - chat
                  - user
            schema:
              $ref: '#/components/schemas/v3-exehandler-create'
      responses:
        '200':
          description: Command handler created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlashCommandResponse'
              examples:
                execution_handler_deluge:
                  summary: Execution handler created - Deluge
                  value:
                    url: /api/v3/commands/227828000000128009/handlers/execution_handler
                    type: execution_handler
                    data:
                      name: execution_handler
                      script: 'response = Map();

                        user = info.get("user_info").get("name");

                        response.put("text", "Hello, " + user + "! Support ticket created.");

                        return response;

                        '
                      function_id: '227828000000128009'
                execution_handler_webhook:
                  summary: Execution handler created - Webhook
                  value:
                    url: /api/v3/commands/227828000000129001/handlers/execution_handler
                    type: execution_handler
                    data:
                      name: execution_handler
                      permissions:
                      - chat
                      - user
                      function_id: '227828000000129001'
                suggestion_handler_deluge:
                  summary: Suggestion handler created - Deluge
                  value:
                    url: /api/v3/commands/227828000000128009/handlers/suggestion_handler
                    type: suggestion_handler
                    data:
                      name: suggestion_handler
                      script: 'suggestions = List();

                        suggestions.add({"value": "create", "label": "Create a new ticket"});

                        suggestions.add({"value": "lookup", "label": "Look up an existing ticket"});

                        return {"suggestions": suggestions};

                        '
                      function_id: '227828000000128009'
                suggestion_handler_webhook:
                  summary: Suggestion handler created - Webhook
                  value:
                    url: /api/v3/commands/227828000000129001/handlers/suggestion_handler
                    type: suggestion_handler
                    data:
                      name: suggestion_handler
                      permissions:
                      - chat
                      - user
                      function_id: '227828000000129001'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The request cannot be performed. Usually because of malformed parameter or missing parameter.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request was rejected because of invalid AuthToken.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The user does not have enough permission or possibly not an user of the respective organization to access the resource.
        '404':
          description: Invalid URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The URL you've sent is wrong. It's possible that the resource you've requested has been moved to another URL.
        '405':
          description: Method Not Allowed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The requested resource does not support the HTTP method used. For example, requesting List of all customers API with PUT as the HTTP method.
        '406':
          description: Not Acceptable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The response has been received but the requested response type is not supported by the browser.
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too many requests within a certain time frame.
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cliq server encountered an error which prevents it from fulfilling the request.
      security:
      - Cliq_Auth:
        - ZohoCliq.Commands.UPDATE
      tags:
      - slashcommands
